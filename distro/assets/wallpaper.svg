  <circle cx="1200" cy="530" r="285" stroke="#b5d4ff" stroke-opacity=".16" stroke-width="3" fill="none"/>
  <circle cx="1200" cy="530" r="355" stroke="#89d6ff" stroke-opacity=".12" stroke-width="2" fill="none"/>
