<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071023"/>
      <stop offset=".5" stop-color="#1c2454"/>
      <stop offset="1" stop-color="#080c20"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#748afe" stop-opacity=".65"/>
      <stop offset=".6" stop-color="#4958ac" stop-opacity=".25"/>
      <stop offset="1" stop-color="#27317a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1=".2" x2="1" y2=".8">
      <stop offset="0" stop-color="#8d9fff" stop-opacity=".1"/>
      <stop offset=".28" stop-color="#8b75ff" stop-opacity=".83"/>
      <stop offset=".6" stop-color="#55cbdd" stop-opacity=".56"/>
      <stop offset="1" stop-color="#2c4092" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7e2ff" stop-opacity=".72"/>
      <stop offset=".6" stop-color="#abbcff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#80d9ff" stop-opacity=".35"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="72"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="21"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/>
  <ellipse cx="1320" cy="445" rx="700" ry="540" fill="url(#halo)" filter="url(#blur)"/>
