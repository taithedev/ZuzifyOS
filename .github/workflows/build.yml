name: ZuzifyOS Linux distribution
on:
  push:
    branches: [main]
    tags: ['linux-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate distro files
        run: python3 distro/scripts/validate.py

  live-iso:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free room for live image assembly
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache
          docker system prune -af || true
          df -h .
      - name: Build Debian 13 KDE live ISO
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work/distro debian:trixie \
            bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              sed -i "s/Components: main$/Components: main contrib non-free-firmware/" /etc/apt/sources.list.d/debian.sources
              apt-get update
              bash scripts/check-packages.sh
              apt-get install -y --no-install-recommends \
                live-build debootstrap ca-certificates curl gnupg \
                squashfs-tools xorriso mtools dosfstools \
                syslinux-utils grub-pc-bin grub-efi-amd64-bin \
                grub-common librsvg2-bin python3 git make rsync wget
              bash scripts/build.sh
            '
      - name: Verify output image
        run: |
          set -euo pipefail
          test -s distro/build/ZuzifyOS-Linux-amd64.iso
          cat distro/build/SHA256SUMS.txt
          file distro/build/ZuzifyOS-Linux-amd64.iso
      - uses: actions/upload-artifact@v4
        with:
          name: ZuzifyOS-Linux-amd64
          path: |
            distro/build/ZuzifyOS-Linux-amd64.iso
            distro/build/SHA256SUMS.txt
          retention-days: 7
      # Each GitHub Release asset has a 2 GiB size limit.
      # The live ISO exceeds that limit, so publish verified 1200 MiB pieces.
      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p distro/build/release
          src=distro/build/ZuzifyOS-Linux-amd64.iso
          base=ZuzifyOS-Windows-Preview.iso
          split --numeric-suffixes=0 --suffix-length=3 --bytes=1200M \
            "$src" "distro/build/release/$base.part"
          sha256sum "$src" | awk '{print $1 "  ZuzifyOS-Windows-Preview.iso"}' \
            > "distro/build/release/$base.sha256"
          cp distro/scripts/Rebuild-ZuzifyOS-ISO.ps1 distro/build/release/
          for piece in distro/build/release/*.part*; do
            test "$(stat -c %s "$piece")" -lt 2147483648
          done
          ls -lh distro/build/release/

      - name: Publish Windows preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=windows-preview
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json assets --jq '.assets[].name' | \
              while IFS= read -r asset; do
                case "$asset" in
                  ZuzifyOS-Windows-Preview.iso.part*|ZuzifyOS-Windows-Preview.iso.sha256|Rebuild-ZuzifyOS-ISO.ps1)
                    gh release delete-asset "$tag" "$asset" -y
                    ;;
                esac
              done
            gh release upload "$tag" distro/build/release/* --clobber
          else
            gh release create "$tag" distro/build/release/* \
              --prerelease --target "$GITHUB_SHA" \
              --title "ZuzifyOS Windows Preview" \
              --notes "Experimental ZuzifyOS Debian 13 KDE desktop with a Windows-style taskbar and Wine support. Download ALL ISO parts, the SHA256 file and Rebuild-ZuzifyOS-ISO.ps1, then reconstruct the ISO on Windows. Test in VirtualBox only. Not Windows; not every EXE will work."
          fi
      - name: Publish version-tagged Linux release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            distro/build/release/*
