name: Build and test ZuzifyOS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make curl xorriso qemu-system-x86 ovmf
      - name: Build 64-bit and 32-bit bootable ISOs
        run: make all
      - name: Test 64-bit BIOS boot
        run: make test
      - name: Test 64-bit UEFI boot
        run: bash scripts/smoke-test-uefi.sh
      - name: Test 32-bit BIOS boot
        run: make test32
      - name: Verify x64 graphical setup and PIN flow
        run: make test-interactive
      - name: Verify x86 text setup and PIN flow
        run: bash scripts/terminal-test-32.sh
      - name: Publish CI image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZuzifyOS-x64-and-x86-boot-images
          path: |
            build/ZuzifyOS.iso
            build/ZuzifyOS-x86.iso
            build/boot.log
            build/boot32.log
            build/uefi.log
            build/interactive.log
            build/interactive32.log
          retention-days: 14
      - name: Publish rolling development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/ZuzifyOS.iso build/ZuzifyOS-x64-nightly.iso
          cp build/ZuzifyOS-x86.iso build/ZuzifyOS-x86-nightly.iso
          (cd build && sha256sum ZuzifyOS-x64-nightly.iso ZuzifyOS-x86-nightly.iso > nightly-SHA256SUMS.txt)
          printf '{"version":"nightly-%s","channel":"nightly","architectures":["x86_64","i686-BIOS"],"automatic_install_supported":false}\n' "$GITHUB_SHA" > build/nightly-update.json
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly build/ZuzifyOS-x64-nightly.iso build/ZuzifyOS-x86-nightly.iso build/nightly-SHA256SUMS.txt build/nightly-update.json --clobber
          else
            gh release create nightly build/ZuzifyOS-x64-nightly.iso build/ZuzifyOS-x86-nightly.iso build/nightly-SHA256SUMS.txt build/nightly-update.json \
              --title "Nightly (experimental)" --notes "64-bit BIOS/UEFI graphical edition and 32-bit BIOS text edition. Virtual machines only. No installed OS auto-updater." --prerelease --target main
          fi
      - name: Prepare tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cp build/ZuzifyOS.iso "build/ZuzifyOS-x64-${tag}.iso"
          cp build/ZuzifyOS-x86.iso "build/ZuzifyOS-x86-${tag}.iso"
          cd build
          sha256sum "ZuzifyOS-x64-${tag}.iso" "ZuzifyOS-x86-${tag}.iso" > SHA256SUMS.txt
          printf '{"version":"%s","channel":"alpha","architectures":["x86_64","i686-BIOS"],"automatic_install_supported":false}\n' "$tag" > update.json
      - name: Create versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            build/ZuzifyOS-x64-${{ github.ref_name }}.iso
            build/ZuzifyOS-x86-${{ github.ref_name }}.iso
            build/SHA256SUMS.txt
            build/update.json
