name: Build and test ZuzifyOS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make curl xorriso qemu-system-x86
      - name: Build bootable image
        run: make iso
      - name: Test kernel boot in QEMU
        run: make test
      - name: Verify terminal commands in QEMU
        run: bash scripts/terminal-test.sh
      - name: Publish CI image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZuzifyOS-bootable-ISO
          path: |
            build/ZuzifyOS.iso
            build/boot.log
          retention-days: 14
      - name: Publish rolling development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/ZuzifyOS.iso build/ZuzifyOS-nightly.iso
          (cd build && sha256sum ZuzifyOS-nightly.iso > nightly-SHA256SUMS.txt)
          HASH=$(cut -d ' ' -f 1 build/nightly-SHA256SUMS.txt)
          printf '{"version":"nightly-%s","channel":"nightly","artifact":"ZuzifyOS-nightly.iso","sha256":"%s","automatic_install_supported":false}\n' "$GITHUB_SHA" "$HASH" > build/nightly-update.json
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly build/ZuzifyOS-nightly.iso build/nightly-SHA256SUMS.txt build/nightly-update.json --clobber
          else
            gh release create nightly build/ZuzifyOS-nightly.iso build/nightly-SHA256SUMS.txt build/nightly-update.json \
              --title "Nightly (experimental)" --notes "Continuously built after successful main-branch tests. Run only inside QEMU. NOT an in-OS auto-update." --prerelease --target main
          fi
      - name: Prepare tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cp build/ZuzifyOS.iso "build/ZuzifyOS-${tag}.iso"
          cd build
          sha256sum "ZuzifyOS-${tag}.iso" > SHA256SUMS.txt
          HASH=$(cut -d ' ' -f 1 SHA256SUMS.txt)
          printf '{"version":"%s","channel":"alpha","artifact":"ZuzifyOS-%s.iso","sha256":"%s","automatic_install_supported":false}\n' "$tag" "$tag" "$HASH" > update.json
      - name: Create versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            build/ZuzifyOS-${{ github.ref_name }}.iso
            build/SHA256SUMS.txt
            build/update.json
