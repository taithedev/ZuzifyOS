name: ZuzifyOS Linux distribution
on:
  push:
    branches: [main]
    tags: ['linux-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate distro files
        run: python3 distro/scripts/validate.py

  live-iso:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free room for live image assembly
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache
          docker system prune -af || true
          df -h .
      - name: Build Debian 13 KDE live ISO
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work/distro debian:trixie \
            bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap ca-certificates curl gnupg \
                squashfs-tools xorriso mtools dosfstools \
                syslinux-utils grub-pc-bin grub-efi-amd64-bin \
                grub-common librsvg2-bin python3 git make rsync wget
              bash scripts/build.sh
            '
      - name: Verify output image
        run: |
          set -euo pipefail
          test -s distro/build/ZuzifyOS-Linux-amd64.iso
          cat distro/build/SHA256SUMS.txt
          file distro/build/ZuzifyOS-Linux-amd64.iso
      - uses: actions/upload-artifact@v4
        with:
          name: ZuzifyOS-Linux-amd64
          path: |
            distro/build/ZuzifyOS-Linux-amd64.iso
            distro/build/SHA256SUMS.txt
          retention-days: 7
      - name: Publish Linux nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp distro/build/ZuzifyOS-Linux-amd64.iso ZuzifyOS-Linux-nightly.iso
          sha256sum ZuzifyOS-Linux-nightly.iso > SHA256SUMS-Linux-nightly.txt
          if gh release view linux-nightly >/dev/null 2>&1; then
            gh release upload linux-nightly ZuzifyOS-Linux-nightly.iso SHA256SUMS-Linux-nightly.txt --clobber
          else
            gh release create linux-nightly ZuzifyOS-Linux-nightly.iso SHA256SUMS-Linux-nightly.txt \
              --prerelease --target main --title "ZuzifyOS Linux Nightly" \
              --notes "Experimental Debian 13 + KDE Plasma live image. Test only in a virtual machine. Not an officially supported installer."
          fi
      - name: Publish version-tagged Linux release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            distro/build/ZuzifyOS-Linux-amd64.iso
            distro/build/SHA256SUMS.txt
